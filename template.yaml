AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
    gallery-functions

    SAM Template for functions working with S3 images bucket

Parameters:
    S3ImagesBucketName:
        Description: S3 images bucket name
        Type: String

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
    Function:
        Timeout: 20
        MemorySize: 128

        # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
        LoggingConfig:
            LogFormat: JSON
Resources:
    CommondDependenciesLayer:
        Type: AWS::Serverless::LayerVersion
        Properties:
            LayerName: common-dependencies
            ContentUri: ./CommonDependencies/out
    GalleryImageApi:
        Type: AWS::Serverless::Api
        Properties:
            StageName: Prod
            BinaryMediaTypes:
                - "multipart/form-data"
            Cors:
                AllowMethods: "'GET,POST,DELETE'"
                AllowHeaders: "'Content-Type,Authorization,Access-Control-Allow-Origin'"
                AllowOrigin: "'*'"
    GetImagesFunction:
        Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
        Properties:
            Tracing: Active
            CodeUri: GetImagesFunction
            Handler: images.Get::handleRequest
            Runtime: java11
            Architectures:
                - x86_64
            MemorySize: 512
            Policies:
                - S3CrudPolicy:
                      BucketName: !Ref S3ImagesBucketName
            Environment: # More info about Env Vars: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#environment-object
                Variables:
                    PARAM1: VALUE
                    JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1 # More info about tiered compilation https://aws.amazon.com/blogs/compute/optimizing-aws-lambda-function-performance-for-java/
                    S3_NAME: !Ref S3ImagesBucketName
            Events:
                GetImage:
                    Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
                    Properties:
                        RestApiId: !Ref GalleryImageApi
                        Path: /image
                        Method: get
            Layers:
                - !Ref CommondDependenciesLayer
    DeleteImageFunction:
        Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
        Properties:
            Tracing: Active
            CodeUri: DeleteImageFunction
            Handler: images.Delete::handleRequest
            Runtime: java11
            Architectures:
                - x86_64
            MemorySize: 512
            Policies:
                - S3CrudPolicy:
                      BucketName: !Ref S3ImagesBucketName
            Environment: # More info about Env Vars: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#environment-object
                Variables:
                    PARAM1: VALUE
                    JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1 # More info about tiered compilation https://aws.amazon.com/blogs/compute/optimizing-aws-lambda-function-performance-for-java/
                    S3_NAME: !Ref S3ImagesBucketName
            Events:
                DeleteImage:
                    Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
                    Properties:
                        RestApiId: !Ref GalleryImageApi
                        Path: /image
                        Method: delete
            Layers:
                - !Ref CommondDependenciesLayer
    UploadImageFunction:
        Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
        Properties:
            Tracing: Active
            CodeUri: UploadImageFunction
            Handler: images.Upload::handleRequest
            Runtime: java11
            Architectures:
                - x86_64
            MemorySize: 512
            Policies:
                - S3CrudPolicy:
                      BucketName: !Ref S3ImagesBucketName
            Environment: # More info about Env Vars: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#environment-object
                Variables:
                    PARAM1: VALUE
                    JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1 # More info about tiered compilation https://aws.amazon.com/blogs/compute/optimizing-aws-lambda-function-performance-for-java/
                    S3_NAME: !Ref S3ImagesBucketName
            Events:
                UploadImage:
                    Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
                    Properties:
                        RestApiId: !Ref GalleryImageApi
                        Path: /image
                        Method: post
            Layers:
                - !Ref CommondDependenciesLayer
Outputs:
    ImagesApi:
        Description: API Gateway endpoint URL for Prod stage for Hello World function
        Value: !Sub "https://${GalleryImageApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/function-api-name"
